<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Auto Moreira</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .title {
      font-size: 4rem;
      animation: rgbAnimation 5s infinite;
      text-align: center;
    }
    @keyframes rgbAnimation {
      0%   { color: rgb(255, 0, 0); }
      33%  { color: rgb(0, 255, 0); }
      66%  { color: rgb(0, 0, 255); }
      100% { color: rgb(255, 0, 0); }
    }
    button {
      margin-top: 2rem;
      padding: 15px 30px;
      font-size: 1.2rem;
      cursor: pointer;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #555;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="title">Auto Moreira</div>
  <button id="startButton">Iniciar Auto Moreira</button>

  <script>
    document.getElementById('startButton').addEventListener('click', function() {
      window.location.href = "https://www.roblox.com/share?code=8d59f04c5cda014f81534c3b8d41ccce&type=Server";
    });
  </script>
</body>
</html>
